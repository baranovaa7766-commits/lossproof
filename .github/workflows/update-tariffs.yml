name: Update tariffs

# Каждую ночь сверяет тарифы Whitebird и Cifra Markets с их официальными
# страницами и обновляет assets/data/tariffs.json. Vercel выкатывает коммит сам.
# 22:00 UTC = 01:00 МСК. GitHub может запускать расписание с задержкой в
# несколько минут — на пиковой нагрузке до получаса.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-tariffs.yml"
      - "scripts/update-tariffs.mjs"
      - "scripts/tariffs-parse.mjs"

permissions:
  contents: write

concurrency:
  group: update-tariffs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Fetch tariffs
        run: node scripts/update-tariffs.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/data/tariffs.json; then
            echo "Тарифы не изменились"
            exit 0
          fi
          git config user.name "lossproof-bot"
          git config user.email "lossproof-bot@users.noreply.github.com"
          git add assets/data/tariffs.json
          git commit -m "Update exchanger tariffs ($(date -u +%F))"
          git pull --rebase origin main
          git push
