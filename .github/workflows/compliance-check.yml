name: Compliance check

# Каждый понедельник в 01:00 МСК (воскресенье 22:00 UTC) проверяет компании,
# представленные на сайте: санкционные списки США, список Банка России о
# нелегальной деятельности, доступность сайтов и смену домена/владельца.
# Сайт сам не меняет. Если что-то найдено — создаёт задачу (Issue) с меткой
# «compliance», назначенную на владельца: GitHub присылает письмо.
# Подробный отчёт каждый раз лежит в разделе Summary запуска (вкладка Actions).
on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/compliance-check.yml"
      - "scripts/compliance-check.mjs"
      - "scripts/compliance-entities.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: compliance-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run checks
        id: check
        run: node scripts/compliance-check.mjs

      - name: Show report in run summary
        if: always()
        run: |
          if [ -f compliance-report.md ]; then cat compliance-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Open an issue if something was found
        if: steps.check.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create compliance --color B60205 --description "Автопроверка компаний сайта" --force
          { echo "@${{ github.repository_owner }}"; echo; cat compliance-report.md; } > issue-body.md
          gh issue create \
            --title "Проверка компаний: найдено замечаний — ${{ steps.check.outputs.count }} ($(date -u +%F))" \
            --body-file issue-body.md \
            --label compliance \
            --assignee "${{ github.repository_owner }}"

      - name: Commit baseline if changed
        run: |
          if git diff --quiet -- scripts/data/compliance-baseline.json && [ -z "$(git ls-files --others --exclude-standard scripts/data/compliance-baseline.json)" ]; then
            echo "Базовая линия не изменилась"
            exit 0
          fi
          git config user.name "lossproof-bot"
          git config user.email "lossproof-bot@users.noreply.github.com"
          git add scripts/data/compliance-baseline.json
          git commit -m "Update compliance baseline ($(date -u +%F))"
          git pull --rebase origin main
          git push
